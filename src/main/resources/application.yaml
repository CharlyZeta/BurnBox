server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

spring:
  application:
    name: burnbox
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/burnbox}
    username: ${SPRING_DATASOURCE_USERNAME:burnbox}
    password: ${SPRING_DATASOURCE_PASSWORD:burnbox}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    mode: HTML
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-28.28logger{25}){cyan} %clr(│){faint} %msg%n%wEx"

burnbox:
  security:
    ip-hash-salt: ${BURNBOX_IP_HASH_SALT:burnbox-default-ip-hash-salt-for-dev}
  scheduler:
    enabled: true
  demo:
    enabled: false
