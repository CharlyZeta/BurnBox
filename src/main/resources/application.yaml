server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: burnbox
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/burnbox}
    username: ${SPRING_DATASOURCE_USERNAME:burnbox}
    password: ${SPRING_DATASOURCE_PASSWORD:burnbox}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    mode: HTML

burnbox:
  scheduler:
    enabled: true
  demo:
    enabled: false
