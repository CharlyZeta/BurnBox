<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta name="robots" content="noindex, nofollow">
    <title>Burnbox — Secreto no disponible</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 2rem; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .icon { font-size: 2.5rem; margin-bottom: 1rem; color: #94a3b8; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
        a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>Secreto no disponible</h1>
        <p>Este secreto no existe, ha vencido su plazo de expiración o ya ha alcanzado el límite de visualizaciones.</p>
        <p><a href="/">Volver a Burnbox</a></p>
    </div>
</body>
</html>
