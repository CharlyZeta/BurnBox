<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Burnbox — Secreto Creado</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 2rem; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .banner { background-color: #065f46; border: 1px solid #10b981; color: #d1fae5; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1.5rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 0.5rem 0; text-align: center; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; text-align: center; }
        .link-container { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        input[type="text"] { flex: 1; background-color: #020617; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.9rem; color: #38bdf8; outline: none; }
        .copy-btn { background-color: #2563eb; color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .copy-btn:hover { background-color: #1d4ed8; }
        .meta-list { background-color: #0f172a; border-radius: 8px; padding: 1rem; font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
        .meta-list div { margin-bottom: 0.35rem; }
        .meta-list div:last-child { margin-bottom: 0; }
        .strong { color: #f8fafc; font-weight: 600; }
        .action-link { display: block; text-align: center; color: #38bdf8; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .action-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="banner">
            ✅ ¡Secreto creado con éxito! Copia el enlace abajo.
        </div>

        <h1>Enlace de un solo uso</h1>
        <p>Comparte este enlace con el destinatario. Por seguridad, no se puede recuperar una vez cerrada esta ventana.</p>

        <div class="link-container">
            <input type="text" id="secret-url" th:value="${secretUrl}" readonly />
            <button class="copy-btn" onclick="navigator.clipboard.writeText(document.getElementById('secret-url').value); this.innerText='¡Copiado!'">Copiar enlace</button>
        </div>

        <div class="meta-list">
            <div>• Visualizaciones permitidas: <span class="strong" th:text="${maxViews}"></span></div>
            <div>• Expiración programada: <span class="strong" th:text="${expiresAt}"></span></div>
            <div>• Token seguro: <span class="strong" th:text="${rawToken}"></span></div>
        </div>

        <a class="action-link" href="/">Crear otro secreto</a>
    </div>
</body>
</html>
