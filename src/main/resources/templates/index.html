<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Burnbox — Compartir Secretos Efímeros</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .card { background-color: #1e293b; border-radius: 12px; padding: 2rem; max-width: 600px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .badge { display: inline-block; background-color: #ef4444; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.5rem; }
        h1 { font-size: 1.75rem; margin: 0 0 0.5rem 0; }
        .subtitle { color: #94a3b8; font-size: 0.95rem; margin: 0; }
        .alert-error { background-color: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1; }
        textarea { width: 100%; box-sizing: border-box; background-color: #020617; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.9rem; color: #f8fafc; min-height: 140px; resize: vertical; }
        textarea:focus, select:focus, input:focus { outline: none; border-color: #38bdf8; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        select, input[type="number"] { width: 100%; box-sizing: border-box; background-color: #020617; border: 1px solid #334155; border-radius: 8px; padding: 0.65rem 0.75rem; font-size: 0.9rem; color: #f8fafc; }
        button { background-color: #2563eb; color: white; border: none; padding: 0.85rem 1.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 0.5rem; }
        button:hover { background-color: #1d4ed8; }
        .security-note { font-size: 0.75rem; color: #64748b; text-align: center; margin-top: 1.25rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="badge">CIFRADO AES-GCM 256</span>
            <h1>Burnbox</h1>
            <p class="subtitle">Comparte contraseñas y secretos con autodestrucción garantizada</p>
        </div>

        <div th:if="${error != null}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/secrets}" method="post">
            <div class="form-group">
                <label for="content">Contenido confidencial</label>
                <textarea id="content" name="content" placeholder="Pega aquí contraseñas, claves API, tokens o información sensible..." th:text="${form != null ? form.content : ''}" required></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="ttl">Expiración (TTL)</label>
                    <select id="ttl" name="ttl">
                        <option value="5m" th:selected="${form != null && form.ttl == '5m'}">5 minutos</option>
                        <option value="1h" th:selected="${form == null || form.ttl == '1h'}">1 hora</option>
                        <option value="1d" th:selected="${form != null && form.ttl == '1d'}">1 día</option>
                        <option value="7d" th:selected="${form != null && form.ttl == '7d'}">7 días</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="maxViews">Visualizaciones máximas</label>
                    <input type="number" id="maxViews" name="maxViews" min="1" max="10" th:value="${form != null ? form.maxViews : 1}" required />
                </div>
            </div>

            <button type="submit">Crear secreto seguro</button>
        </form>

        <p class="security-note">🔒 Cifrado de extremo a extremo. Cero persistencia en claro. Destrucción atómica.</p>
    </div>
</body>
</html>
